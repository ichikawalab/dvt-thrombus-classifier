# Default training and evaluation settings.
#
# Seeds are shared across architectures, so every model is trained and evaluated
# on identical splits and comparisons between models are paired.  Changing
# n_repetitions, n_folds or base_seed breaks that correspondence.

training:
  arch: vit_base_patch16_384.augreg_in21k_ft_in1k
  pretrained: true

  n_repetitions: 10
  n_folds: 5
  base_seed: 42

  learning_rate: 1.0e-5
  weight_decay: 1.0e-3
  batch_size: 16
  max_epochs: 100
  min_epochs: 10
  warmup_epochs: 5
  early_stopping_patience: 5

  hidden_dim: 512
  dropout_rate: 0.5

  num_workers: 4             # Lower to 0 if Windows worker start-up causes trouble
  precision: bf16-mixed      # bf16-mixed | 16-mixed | 32-true
                             #   bf16-mixed : default on Ampere+ GPUs (RTX 30xx/40xx, A100,
                             #                H100). fp32-like dynamic range, no loss
                             #                scaling, more robust than fp16.
                             #   16-mixed   : older GPUs (V100 / Turing / Pascal).
                             #   32-true    : when bit-level reproducibility matters; mixed
                             #                precision is not reproducible across GPU models.
                             # Evaluation and prediction always run in fp32.
