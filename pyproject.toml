[project]
name = "dvt-thrombus-classifier"
version = "1.1.0"
description = "Deep learning classification of thrombus presence in static B-mode lower-extremity venous ultrasound images, with patient-level repeated cross-validation and probability-based ensembles."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Ichikawa Lab" }]
keywords = [
    "deep-vein-thrombosis",
    "ultrasound",
    "medical-imaging",
    "deep-learning",
    "cross-validation",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Statistical reporting does not require the deep-learning stack.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",
    "pytorch-lightning>=2.5",
    "pillow>=10.2",
    "grad-cam>=1.5",
    "openpyxl>=3.1",
]

[project.urls]
Repository = "https://github.com/ichikawalab/dvt-thrombus-classifier"

[project.scripts]
dvt-train = "dvt_thrombus.cli:train_main"
dvt-predict = "dvt_thrombus.cli:predict_main"
dvt-gradcam = "dvt_thrombus.cli:gradcam_main"
dvt-stats = "dvt_thrombus.cli:stats_main"
dvt-benchmark = "dvt_thrombus.cli:benchmark_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dvt_thrombus"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
